<!DOCTYPE html>
<html lang="en" style="width:100%; height:100%; overflow:hidden; background-color:#0d0d0d; color:#e0e0e0; font-family:sans-serif;">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebForge 1.20.1 - Maximum Optimization</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <script src="https://cjrtnc.leaningtech.com/4.2/loader.js"></script>
    <style>
      body { margin: 0; width: 100%; height: 100%; display: flex; flex-direction: column; }
      #launcher-menu {
        padding: 15px 25px;
        background: #1a1a1a;
        border-bottom: 2px solid #333;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        z-index: 10;
      }
      .btn {
        padding: 10px 18px; margin-top: 10px; cursor: pointer;
        background: #00e676; color: #000; font-weight: 800;
        border: none; border-radius: 4px; font-size: 14px;
        transition: background 0.2s;
      }
      .btn:hover:not(:disabled) { background: #00c853; }
      .btn:disabled { background: #444; color: #888; cursor: not-allowed; }
      .input-field {
        background: #2a2a2a; border: 1px solid #444; color: #fff;
        padding: 6px 10px; border-radius: 4px;
      }
      #status { margin-top: 12px; font-size: 13px; color: #b9f6ca; font-family: monospace; }
      
      /* Diagnostic Console */
      #console-container {
        flex: 1; background: #000; color: #00ff66;
        font-family: 'Courier New', Courier, monospace; font-size: 12px;
        padding: 15px; overflow-y: auto; white-space: pre-wrap; word-wrap: break-word;
      }
      .log-info { color: #00e676; }
      .log-warn { color: #ffab00; }
      .log-err { color: #ff1744; font-weight: bold; background: rgba(255, 23, 68, 0.1); display: inline-block; width: 100%; }
      
      #game-container { display: none; width: 100%; height: 100%; background: #000; }
    </style>
  </head>
  <body>

    <div id="launcher-menu">
      <h2 style="margin-top: 0; color: #fff;">WebForge Engine Probe (1.20.1)</h2>

      <div style="margin-bottom: 15px;">
        <label for="username-input" style="font-size: 14px;">Username: </label>
        <input type="text" id="username-input" class="input-field" value="WebPlayer" style="margin-left: 5px;">
      </div>

      <div>
        <label style="font-size: 14px;"><strong>Execution Target:</strong></label>
        <select id="target-mode" class="input-field" style="margin-left: 5px;">
          <option value="forge">Forge 1.20.1 Bootstrap (Heavy)</option>
          <option value="vanilla">Vanilla 1.20.1 Client (Direct LWJGL Probe)</option>
        </select>
      </div>

      <button id="start-btn" class="btn" disabled>Initialize 1.20.1 Execution</button>
      <div id="status">Awaiting CheerpJ 4.2 JRE 17 load...</div>
    </div>

    <!-- Live execution trace -->
    <div id="console-container"></div>

    <div id="game-container">
      <minecraft-client style="width: 100%; height: 100%;"></minecraft-client>
    </div>

    <script type="module">
      const consoleBox = document.getElementById("console-container");
      const statusText = document.getElementById("status");
      const startBtn = document.getElementById("start-btn");
      const targetMode = document.getElementById("target-mode");
      const usernameInput = document.getElementById("username-input");

      // High-performance logger to prevent DOM stalling
      function log(msg, type = "info") {
        const div = document.createElement("div");
        div.className = `log-${type}`;
        div.textContent = `[${new Date().toISOString().split('T')[1].slice(0,-1)}] ${msg}`;
        consoleBox.appendChild(div);
        // Only auto-scroll if near the bottom to save CPU cycles
        if (consoleBox.scrollHeight - consoleBox.scrollTop < 600) {
          consoleBox.scrollTop = consoleBox.scrollHeight;
        }
      }

      // Intercept browser console
      const origLog = console.log; const origWarn = console.warn; const origErr = console.error;
      console.log = (...args) => { log(args.join(" "), "info"); origLog(...args); };
      console.warn = (...args) => { log(args.join(" "), "warn"); origWarn(...args); };
      console.error = (...args) => { log(args.join(" "), "err"); origErr(...args); };

      const nativesPath = `/app${new URL("natives", import.meta.url).pathname}`;

      // Initialize JVM with aggressive optimizations
      try {
        log("Booting OpenJDK 17 with maximum browser optimizations...");
        await cheerpjInit({
          version: 17,
          status: "none", // Disable default UI to save DOM renders
          disableMetrics: true,
          javaProperties: [
            `java.library.path=${nativesPath}`,
            "org.lwjgl.util.NoChecks=true",
            "fml.ignoreInvalidMinecraftCertificates=true",
            "sun.java2d.opengl=true", // Hint Java to use GL pipeline if possible
            "cheerpj.disableMetrics=true"
          ]
        });

        statusText.innerText = "JVM 17 Ready. Awaiting launch command.";
        statusText.style.color = "#00e676";
        log("CheerpJ initialization complete.");
        startBtn.disabled = false;
      } catch (e) {
        log(`CRITICAL INIT FAILURE: ${e.message || e}`, "err");
        statusText.innerText = "Initialization failed. Check logs.";
        statusText.style.color = "#ff1744";
      }

      startBtn.addEventListener("click", async () => {
        startBtn.disabled = true;
        const mode = targetMode.value;
        const username = usernameInput.value || "Player";

        log(`--> Triggering execution sequence for: ${mode.toUpperCase()}`);

        try {
          if (mode === "vanilla") {
            log("Mounting /app/minecraft-1.20.1-client.jar...");
            await cheerpjRunMain(
              "net.minecraft.client.main.Main",
              "/app/minecraft-1.20.1-client.jar",
              "--version", "1.20.1",
              "--username", username,
              "--gameDir", "/files/game",
              "--assetsDir", "/files/assets"
            );
          } else {
            log("Mounting ForgeBootstrap and resolving module pathways...");
            const classpath = "/app/forge-1.20.1-47.4.28-universal.jar:/app/minecraft-1.20.1-client.jar";
            await cheerpjRunMain(
              "net.minecraftforge.bootstrap.ForgeBootstrap",
              classpath,
              "--version", "1.20.1",
              "--username", username,
              "--gameDir", "/files/game",
              "--assetsDir", "/files/assets"
            );
          }
        } catch (err) {
          log(`FATAL EXCEPTION: ${err.message || err}`, "err");
          if (err.stack) log(err.stack, "err");
          statusText.innerText = "Execution halted. See console trace.";
          statusText.style.color = "#ff1744";
          startBtn.disabled = false; // Allow re-attempt
        }
      });
    </script>
  </body>
</html>

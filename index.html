<!DOCTYPE html>
<html lang="en" style="width:100%;height:100%;overflow:hidden;background-color:#121212;color:#eee;font-family:sans-serif;">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebForge 1.20.1 Probe</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <script src="https://cjrtnc.leaningtech.com/4.2/loader.js"></script>
    <style>
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      #launcher-menu {
        padding: 20px;
        background: #1e1e1e;
        border-bottom: 2px solid #333;
      }
      #launcher-menu button {
        padding: 10px 20px;
        margin-top: 10px;
        cursor: pointer;
        background: #4CAF50;
        color: black;
        font-weight: bold;
        border: none;
        border-radius: 4px;
        font-size: 15px;
      }
      #launcher-menu button:disabled {
        background: #555;
        cursor: not-allowed;
      }
      #status {
        margin-top: 10px;
        font-size: 14px;
        color: #81c784;
      }
      #console-container {
        flex: 1;
        background: #000;
        color: #00ff66;
        font-family: monospace;
        font-size: 13px;
        padding: 15px;
        overflow-y: auto;
        white-space: pre-wrap;
        box-sizing: border-box;
      }
      .log-err { color: #ff5252; }
      .log-warn { color: #ffb74d; }
      #game-container {
        display: none;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>

    <div id="launcher-menu">
      <h2>WebForge 1.20.1 Diagnostics (LWJGL 2 / CheerpJ 4.2)</h2>

      <div>
        <label for="username-input">Player Username: </label>
        <input type="text" id="username-input" value="Player" style="padding: 5px; margin-left: 5px;">
      </div>
      <br>

      <div>
        <label><strong>Launch Target:</strong></label>
        <select id="target-mode" style="padding: 5px;">
          <option value="forge">Forge 1.20.1 (ForgeBootstrap)</option>
          <option value="vanilla">Vanilla 1.20.1 Client (Direct LWJGL Probe)</option>
        </select>
      </div>

      <button id="start-btn" disabled>Launch 1.20.1 & Capture Errors</button>
      <div id="status">Booting CheerpJ 4.2 (Java 17)...</div>
    </div>

    <!-- On-screen terminal box capturing JVM stack traces -->
    <div id="console-container">Initializing environment...</div>

    <div id="game-container">
      <minecraft-client style="width: 100%; height: 100%;"></minecraft-client>
    </div>

    <script type="module">
      const consoleBox = document.getElementById("console-container");
      const statusText = document.getElementById("status");
      const startBtn = document.getElementById("start-btn");
      const menu = document.getElementById("launcher-menu");
      const targetMode = document.getElementById("target-mode");
      const usernameInput = document.getElementById("username-input");

      function log(msg, type = "info") {
        const div = document.createElement("div");
        if (type === "err") div.className = "log-err";
        if (type === "warn") div.className = "log-warn";
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        consoleBox.appendChild(div);
        consoleBox.scrollTop = consoleBox.scrollHeight;
      }

      // Mirror all browser console messages into the on-screen box
      const origLog = console.log;
      const origWarn = console.warn;
      const origErr = console.error;
      console.log = (...args) => { log(args.join(" ")); origLog(...args); };
      console.warn = (...args) => { log(args.join(" "), "warn"); origWarn(...args); };
      console.error = (...args) => { log(args.join(" "), "err"); origErr(...args); };

      const nativesPath = `/app${new URL("natives", import.meta.url).pathname}`;

      try {
        log("Loading CheerpJ runtime with OpenJDK 17 and module boundaries opened...");
        await cheerpjInit({
          version: 17,
          javaProperties: [
            `java.library.path=${nativesPath}`,
            "org.lwjgl.util.NoChecks=true",
            "fml.ignoreInvalidMinecraftCertificates=true",
            "--add-opens=java.base/java.lang=ALL-UNNAMED",
            "--add-opens=java.base/java.lang.invoke=ALL-UNNAMED",
            "--add-opens=java.base/java.util=ALL-UNNAMED"
          ]
        });

        statusText.innerText = "CheerpJ 17 initialized. Ready to probe.";
        log("CheerpJ JRE 17 ready.");
        startBtn.disabled = false;
      } catch (e) {
        log(`Failed to initialize CheerpJ: ${e.message || e}`, "err");
        statusText.innerText = "Initialization failed. Check logs.";
      }

      startBtn.addEventListener("click", async () => {
        startBtn.disabled = true;
        const mode = targetMode.value;
        const username = usernameInput.value || "Player";

        log(`Starting launch probe (Mode: ${mode})...`);

        try {
          if (mode === "vanilla") {
            // Probe vanilla 1.20.1 against the existing LWJGL 2 shim
            log("Executing net.minecraft.client.main.Main from /app/minecraft-1.20.1-client.jar...");
            await cheerpjRunMain(
              "net.minecraft.client.main.Main",
              "/app/minecraft-1.20.1-client.jar",
              "--version", "1.20.1",
              "--username", username,
              "--gameDir", "/files/game",
              "--assetsDir", "/files/assets"
            );
          } else {
            // Probe Forge 1.20.1 ModLauncher bootstrap
            log("Executing net.minecraftforge.bootstrap.ForgeBootstrap...");
            const classpath = "/app/forge-1.20.1-47.4.28-universal.jar:/app/minecraft-1.20.1-client.jar";
            await cheerpjRunMain(
              "net.minecraftforge.bootstrap.ForgeBootstrap",
              classpath,
              "--version", "1.20.1",
              "--username", username,
              "--gameDir", "/files/game",
              "--assetsDir", "/files/assets"
            );
          }
        } catch (err) {
          log(`CRASH TRACE DETECTED: ${err.message || err}`, "err");
          if (err.stack) {
            log(err.stack, "err");
          }
        }
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en" style="width:100%; height:100%; overflow:hidden; background-color:#050505; color:#e0e0e0; font-family:sans-serif;">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebForge 1.20.1 - LWJGL 3 Bridge Test</title>
    <script src="https://cjrtnc.leaningtech.com/4.2/loader.js"></script>
    <style>
      body { margin: 0; display: flex; flex-direction: column; }
      #launcher-menu { padding: 15px; background: #111; border-bottom: 2px solid #2a2a2a; }
      .btn { padding: 10px 18px; background: #00e676; color: #000; font-weight: bold; border: none; cursor: pointer; }
      .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
      #console-container { flex: 1; background: #000; color: #00ff66; font-family: monospace; font-size: 12px; padding: 15px; overflow-y: auto; white-space: pre-wrap; }
      .log-info { color: #00e676; }
      .log-err { color: #ff1744; font-weight: bold; }
      .log-glfw { color: #00b0ff; font-weight: bold; background: rgba(0, 176, 255, 0.1); }
      canvas { display: none; margin: 0 auto; border: 2px solid #333; }
    </style>
  </head>
  <body>

    <div id="launcher-menu">
      <h2 style="margin: 0 0 10px 0; color: #fff;">LWJGL 3 JavaScript Bridge (Vanilla 1.20.1)</h2>
      <button id="start-btn" class="btn" disabled>Boot Engine & Test GLFW Bridge</button>
      <span id="status" style="margin-left: 10px; color: #b9f6ca; font-family: monospace;">Awaiting CheerpJ...</span>
    </div>

    <!-- The WebGL Canvas Minecraft will eventually draw to -->
    <canvas id="minecraft-canvas" width="854" height="480"></canvas>
    <div id="console-container"></div>

    <script type="module">
      const consoleBox = document.getElementById("console-container");
      const statusText = document.getElementById("status");
      const startBtn = document.getElementById("start-btn");

      function log(msg, type = "info") {
        const div = document.createElement("div");
        div.className = `log-${type}`;
        div.textContent = `[${new Date().toISOString().split('T')[1].slice(0,-1)}] ${msg}`;
        consoleBox.appendChild(div);
        consoleBox.scrollTop = consoleBox.scrollHeight;
      }

      // Intercept standard logs
      const origLog = console.log; const origErr = console.error;
      console.log = (...args) => { log(args.join(" "), "info"); origLog(...args); };
      console.error = (...args) => { log(args.join(" "), "err"); origErr(...args); };

      // ==========================================
      // PHASE 1: THE LWJGL 3 / GLFW JS BRIDGE
      // ==========================================
      const glfwBridge = {
        // Intercept: org.lwjgl.glfw.GLFW.nglfwInit()
        async Java_org_lwjgl_glfw_GLFW_nglfwInit(lib) {
          log(">> SUCCESS: Intercepted nglfwInit()!", "glfw");
          return 1; // 1 = GLFW_TRUE (Success)
        },
        
        // Intercept: org.lwjgl.glfw.GLFW.nglfwSetErrorCallback()
        async Java_org_lwjgl_glfw_GLFW_nglfwSetErrorCallback(lib, callbackPtr) {
          log(`>> SUCCESS: Intercepted nglfwSetErrorCallback (Pointer: ${callbackPtr})`, "glfw");
          return 0; // Return dummy previous callback pointer
        },
        
        // Intercept: org.lwjgl.glfw.GLFW.nglfwCreateWindow()
        async Java_org_lwjgl_glfw_GLFW_nglfwCreateWindow(lib, width, height, titlePtr, monitorPtr, sharePtr) {
          log(`>> SUCCESS: Intercepted nglfwCreateWindow (${width}x${height})`, "glfw");
          document.getElementById("minecraft-canvas").style.display = "block";
          return 123456789; // Return dummy window pointer address
        },

        // Intercept: org.lwjgl.glfw.GLFW.nglfwMakeContextCurrent()
        async Java_org_lwjgl_glfw_GLFW_nglfwMakeContextCurrent(lib, windowPtr) {
          log(`>> SUCCESS: Intercepted nglfwMakeContextCurrent for window ${windowPtr}`, "glfw");
        },

        // Intercept: MemoryUtil / Unsafe allocators (often hit early)
        async Java_org_lwjgl_system_MemoryUtil_nmemAlloc(lib, size) {
          log(`>> Intercepted MemoryUtil.nmemAlloc (${size} bytes)`, "glfw");
          return 999999; // Dummy pointer
        }
      };

      try {
        log("Booting OpenJDK 17 with injected GLFW Native Bridge...");
        await cheerpjInit({
          version: 17,
          status: "none",
          natives: glfwBridge, // Inject our custom JavaScript C++ wrapper
          javaProperties: [
            "org.lwjgl.util.NoChecks=true",
            "java.awt.headless=false"
          ]
        });

        statusText.innerText = "Bridge Ready.";
        startBtn.disabled = false;
      } catch (e) {
        log(`INIT FAILURE: ${e.message}`, "err");
      }

      async function downloadAndMount(filename) {
        log(`Fetching ${filename}...`);
        const response = await fetch(`./${filename}`);
        if (!response.ok) throw new Error(`Missing ${filename}`);
        const view = new Uint8Array(await response.arrayBuffer());
        cheerpOSAddStringFile(`/str/${filename}`, view);
        return `/str/${filename}`;
      }

      startBtn.addEventListener("click", async () => {
        startBtn.disabled = true;
        try {
          // Mount the Vanilla client ONLY to bypass Forge Classpath Hell
          const clientPath = await downloadAndMount("minecraft-1.20.1-client.jar");
          
          log(`Executing net.minecraft.client.main.Main...`);
          await cheerpjRunMain(
            "net.minecraft.client.main.Main",
            clientPath,
            "--version", "1.20.1",
            "--username", "Player",
            "--gameDir", "/files/game",
            "--assetsDir", "/files/assets"
          );
        } catch (err) {
          log(`HALT: ${err.message || err}`, "err");
          if (err.stack) log(err.stack, "err");
          startBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en" style="width:100%; height:100%; overflow:hidden; background-color:#070709; color:#e4e4e7; font-family:system-ui,-apple-system,sans-serif;">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebForge 1.20.1 — LWJGL 3 & OpenJDK 17 Engine</title>
    <link rel="icon" href="data:,">
    <script src="https://cjrtnc.leaningtech.com/4.2/loader.js"></script>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #070709;
      }
      #top-bar {
        padding: 12px 18px;
        background: #121216;
        border-bottom: 1px solid #27272a;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        z-index: 20;
      }
      .brand {
        font-weight: 800;
        font-size: 16px;
        color: #00e676;
        letter-spacing: 0.4px;
        margin-right: 8px;
      }
      .control-group {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        background: #18181c;
        padding: 5px 10px;
        border-radius: 6px;
        border: 1px solid #27272a;
      }
      input[type="text"], select {
        background: #09090b;
        border: 1px solid #3f3f46;
        color: #f4f4f5;
        padding: 5px 8px;
        border-radius: 4px;
        font-size: 13px;
      }
      .btn {
        padding: 8px 14px;
        background: #00e676;
        color: #050505;
        font-weight: 700;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.15s ease;
      }
      .btn:hover:not(:disabled) { background: #00c853; transform: translateY(-1px); }
      .btn:disabled { background: #27272a; color: #71717a; cursor: not-allowed; }
      .btn-secondary {
        background: #27272a;
        color: #e4e4e7;
        border: 1px solid #3f3f46;
      }
      .btn-secondary:hover:not(:disabled) { background: #3f3f46; }
      #status-banner {
        font-family: monospace;
        font-size: 12px;
        color: #a1a1aa;
        margin-left: auto;
      }
      #progress-strip {
        height: 4px;
        width: 100%;
        background: #18181b;
        position: relative;
        overflow: hidden;
      }
      #progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00e676, #00b0ff);
        transition: width 0.15s ease;
      }
      #main-split {
        flex: 1;
        display: flex;
        overflow: hidden;
      }
      #console-pane {
        flex: 1;
        background: #050507;
        color: #d4d4d8;
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-size: 12px;
        padding: 14px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-all;
        border-right: 1px solid #1f1f23;
      }
      #viewport-pane {
        flex: 1.4;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        position: relative;
      }
      .log-info { color: #86efac; }
      .log-warn { color: #fde047; }
      .log-err { color: #f87171; font-weight: bold; background: rgba(248, 113, 113, 0.08); padding: 2px 4px; }
      .log-glfw { color: #38bdf8; font-weight: bold; }
      .log-gl { color: #c084fc; }
      .log-net { color: #fb923c; }
    </style>
  </head>
  <body>

    <div id="top-bar">
      <div class="brand">WEBFORGE 1.20.1 [LWJGL 3]</div>

      <div class="control-group">
        <label for="username-input">User:</label>
        <input type="text" id="username-input" value="Player" style="width:95px;">
      </div>

      <div class="control-group">
        <label for="launch-mode">Profile:</label>
        <select id="launch-mode">
          <option value="vanilla">Vanilla 1.20.1 (Direct Main)</option>
          <option value="forge-flat">Forge 1.20.1 (Unified Classpath)</option>
          <option value="forge-bootstrap">Forge 1.20.1 (BootstrapLauncher)</option>
        </select>
      </div>

      <div class="control-group">
        <label title="Optional: Pick your local Prism Launcher libraries/ folder to skip cloud downloading">
          Prism Libs Folder:
        </label>
        <input type="file" id="prism-libs-input" webkitdirectory directory multiple style="width:170px; font-size:11px;">
      </div>

      <div class="control-group">
        <label>Mods (.jar):</label>
        <input type="file" id="mod-upload" multiple accept=".jar" style="width:140px; font-size:11px;">
      </div>

      <button id="clear-cache-btn" class="btn btn-secondary" title="Clear IndexedDB cached libraries">Clear Lib Cache</button>
      <button id="start-btn" class="btn" disabled>Boot 1.20.1 Engine</button>

      <div id="status-banner">Initializing CheerpJ 4.2...</div>
    </div>

    <div id="progress-strip"><div id="progress-fill"></div></div>

    <div id="main-split">
      <div id="console-pane"></div>
      <div id="viewport-pane">
        <minecraft-client id="mc-element" style="width:100%; height:100%;"></minecraft-client>
      </div>
    </div>

    <script type="module">
      import MinecraftClient from "./minecraft-web.js";
      import lwjglNatives from "./natives/lwjgl.js";
      import netlibNatives from "./natives/netlib.js";

      const consolePane = document.getElementById("console-pane");
      const statusBanner = document.getElementById("status-banner");
      const progressFill = document.getElementById("progress-fill");
      const startBtn = document.getElementById("start-btn");
      const clearCacheBtn = document.getElementById("clear-cache-btn");
      const launchModeSelect = document.getElementById("launch-mode");
      const usernameInput = document.getElementById("username-input");
      const prismLibsInput = document.getElementById("prism-libs-input");
      const modUploadInput = document.getElementById("mod-upload");
      const mcElement = document.getElementById("mc-element");

      function log(msg, cls = "info") {
        const line = document.createElement("div");
        line.className = `log-${cls}`;
        const ts = new Date().toISOString().split("T")[1].slice(0, -1);
        line.textContent = `[${ts}] ${msg}`;
        consolePane.appendChild(line);
        if (consolePane.scrollHeight - consolePane.scrollTop < 800) {
          consolePane.scrollTop = consolePane.scrollHeight;
        }
      }

      window.webforgeLog = log;

      const origLog = console.log;
      const origWarn = console.warn;
      const origErr = console.error;
      console.log = (...a) => { log(a.join(" "), "info"); origLog(...a); };
      console.warn = (...a) => { log(a.join(" "), "warn"); origWarn(...a); };
      console.error = (...a) => { log(a.join(" "), "err"); origErr(...a); };

      // Plain object combining explicit LWJGL 3 + Netlib JNI functions (no Proxy traps)
      const combinedNatives = Object.assign({}, lwjglNatives, netlibNatives);
      const nativesPath = `/app${new URL("natives", import.meta.url).pathname}`;

      try {
        log("Booting CheerpJ 4.2 (OpenJDK 17) with explicit LWJGL 3.3.1 Native Table...", "glfw");
        await cheerpjInit({
          version: 17,
          status: "none",
          disableMetrics: true,
          natives: combinedNatives,
          javaProperties: [
            `java.library.path=${nativesPath}`,
            "org.lwjgl.util.NoChecks=true",
            "org.lwjgl.util.Debug=true",
            "org.lwjgl.util.DebugLoader=true",
            "org.lwjgl.system.allocator=system",
            "org.lwjgl.glfw.checkThread0=false",
            "java.awt.headless=false",
            "fml.ignoreInvalidMinecraftCertificates=true",
            "fml.ignorePatchDiscrepancies=true"
          ]
        });

        // Register custom element AFTER cheerpjInit so cheerpjCreateDisplay is valid
        MinecraftClient.register();

        statusBanner.textContent = "JVM 17 Ready.";
        statusBanner.style.color = "#00e676";
        log("CheerpJ 17 & LWJGL 3 Native Bridge Ready. Click 'Boot 1.20.1 Engine' to launch.", "glfw");
        startBtn.disabled = false;
      } catch (err) {
        log(`FATAL JVM INIT ERROR: ${err.message || err}`, "err");
        statusBanner.textContent = "Init Failed";
      }

      clearCacheBtn.addEventListener("click", async () => {
        await mcElement.clearLibraryCache();
        log("Cleared IndexedDB library cache.", "warn");
      });

      startBtn.addEventListener("click", async () => {
        startBtn.disabled = true;
        const mode = launchModeSelect.value;
        const username = usernameInput.value || "Player";
        const localLibFiles = Array.from(prismLibsInput.files || []);
        const modFiles = Array.from(modUploadInput.files || []);

        try {
          await mcElement.run1201({
            mode,
            username,
            localLibFiles,
            modFiles,
            onProgress(pct, statusMsg) {
              progressFill.style.width = `${Math.min(100, Math.max(0, pct))}%`;
              if (statusMsg) statusBanner.textContent = statusMsg;
            },
            log
          });
        } catch (err) {
          log(`EXECUTION HALTED: ${err.message || err}`, "err");
          if (err.stack) log(err.stack, "err");
          statusBanner.textContent = "Execution Halted";
          statusBanner.style.color = "#f87171";
          startBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>

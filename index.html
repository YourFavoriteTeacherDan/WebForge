<!DOCTYPE html>
<html lang="en" style="width:100%; height:100%; overflow:hidden; background-color:#070709; color:#e4e4e7; font-family:system-ui,-apple-system,sans-serif;">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebForge 1.20.1 — LWJGL 3 & OpenJDK 17 Engine</title>
    <link rel="icon" href="data:,">
    <script src="https://cjrtnc.leaningtech.com/4.2/loader.js"></script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; width: 100%; height: 100%; display: flex; flex-direction: column; background: #070709; }
      #top-bar {
        padding: 10px 16px; background: #121216; border-bottom: 1px solid #27272a;
        display: flex; flex-wrap: wrap; align-items: center; gap: 10px; z-index: 20;
      }
      .brand { font-weight: 800; font-size: 15px; color: #00e676; letter-spacing: 0.4px; margin-right: 4px; }
      .control-group {
        display: flex; align-items: center; gap: 6px; font-size: 12px;
        background: #18181c; padding: 5px 9px; border-radius: 6px; border: 1px solid #27272a;
      }
      input[type="text"], select {
        background: #09090b; border: 1px solid #3f3f46; color: #f4f4f5;
        padding: 4px 7px; border-radius: 4px; font-size: 12px;
      }
      .btn {
        padding: 7px 13px; background: #00e676; color: #050505; font-weight: 700;
        border: none; border-radius: 5px; cursor: pointer; font-size: 12px;
      }
      .btn:hover:not(:disabled) { background: #00c853; }
      .btn:disabled { background: #27272a; color: #71717a; cursor: not-allowed; }
      .btn-secondary { background: #27272a; color: #e4e4e7; border: 1px solid #3f3f46; }
      #db-stats {
        font-family: monospace; font-size: 11px; color: #38bdf8;
        background: rgba(56, 189, 248, 0.1); padding: 5px 8px; border-radius: 5px;
      }
      #status-banner { font-family: monospace; font-size: 12px; color: #a1a1aa; margin-left: auto; }
      #progress-strip { height: 4px; width: 100%; background: #18181b; overflow: hidden; }
      #progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00e676, #00b0ff); transition: width 0.15s ease; }
      #main-split { flex: 1; display: flex; overflow: hidden; }
      #console-pane {
        flex: 1; background: #050507; color: #d4d4d8; font-family: monospace;
        font-size: 12px; padding: 14px; overflow-y: auto; white-space: pre-wrap;
        word-break: break-all; border-right: 1px solid #1f1f23;
      }
      #viewport-pane { flex: 1.4; display: flex; align-items: center; justify-content: center; background: #000; position: relative; }
      .log-info { color: #86efac; }
      .log-warn { color: #fde047; }
      .log-err { color: #f87171; font-weight: bold; }
      .log-glfw { color: #38bdf8; font-weight: bold; }
      .log-net { color: #fb923c; }
    </style>
  </head>
  <body>

    <div id="top-bar">
      <div class="brand">WEBFORGE 1.20.1</div>

      <div class="control-group">
        <label for="username-input">User:</label>
        <input type="text" id="username-input" value="Player" style="width:85px;">
      </div>

      <div class="control-group">
        <label for="launch-mode">Profile:</label>
        <select id="launch-mode">
          <option value="vanilla">Vanilla 1.20.1 (Direct Main)</option>
          <option value="forge-flat">Forge 1.20.1 (Unified Classpath)</option>
          <option value="forge-bootstrap">Forge 1.20.1 (BootstrapLauncher)</option>
        </select>
      </div>

      <div class="control-group">
        <label>Save Prism `libraries/` to DB:</label>
        <input type="file" id="prism-libs-input" webkitdirectory directory multiple style="width:155px; font-size:11px;">
      </div>

      <div class="control-group">
        <label>Save Mods (.jar) to DB:</label>
        <input type="file" id="mod-upload" multiple accept=".jar" style="width:135px; font-size:11px;">
      </div>

      <div id="db-stats">IndexedDB: Checking...</div>

      <button id="clear-cache-btn" class="btn btn-secondary">Clear Lib/Mod DB</button>
      <button id="start-btn" class="btn" disabled>Boot 1.20.1 Engine</button>

      <div id="status-banner">Initializing CheerpJ 4.2...</div>
    </div>

    <div id="progress-strip"><div id="progress-fill"></div></div>

    <div id="main-split">
      <div id="console-pane"></div>
      <div id="viewport-pane">
        <minecraft-client id="mc-element" style="width:100%; height:100%;"></minecraft-client>
      </div>
    </div>

    <script type="module">
      import MinecraftClient from "./minecraft-web.js?v=1201_v6";
      import lwjglNatives from "./natives/lwjgl.js?v=1201_v6";
      import netlibNatives from "./natives/netlib.js?v=1201_v6";

      const consolePane = document.getElementById("console-pane");
      const statusBanner = document.getElementById("status-banner");
      const dbStats = document.getElementById("db-stats");
      const progressFill = document.getElementById("progress-fill");
      const startBtn = document.getElementById("start-btn");
      const clearCacheBtn = document.getElementById("clear-cache-btn");
      const launchModeSelect = document.getElementById("launch-mode");
      const usernameInput = document.getElementById("username-input");
      const prismLibsInput = document.getElementById("prism-libs-input");
      const modUploadInput = document.getElementById("mod-upload");
      const mcElement = document.getElementById("mc-element");

      function log(msg, cls = "info") {
        const line = document.createElement("div");
        line.className = `log-${cls}`;
        const ts = new Date().toISOString().split("T")[1].slice(0, -1);
        line.textContent = `[${ts}] ${msg}`;
        consolePane.appendChild(line);
        if (consolePane.scrollHeight - consolePane.scrollTop < 800) {
          consolePane.scrollTop = consolePane.scrollHeight;
        }
      }

      window.webforgeLog = log;
      const origLog = console.log, origWarn = console.warn, origErr = console.error;
      console.log = (...a) => { log(a.join(" "), "info"); origLog(...a); };
      console.warn = (...a) => { log(a.join(" "), "warn"); origWarn(...a); };
      console.error = (...a) => { log(a.join(" "), "err"); origErr(...a); };

      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(() => {});
      }

      const rawNatives = Object.assign({}, lwjglNatives, netlibNatives);
      const combinedNatives = lwjglNatives.__createStrictLWJGLProxy
        ? lwjglNatives.__createStrictLWJGLProxy(rawNatives, log)
        : rawNatives;

      async function refreshDBStats() {
        if (typeof mcElement.getStorageSummary === "function") {
          const s = await mcElement.getStorageSummary();
          dbStats.textContent = `DB: ${s.prismLibs} Prism | ${s.cloudLibs} Cloud | ${s.mods} Mods | Worlds: /files/game/saves`;
        }
      }

      try {
        log("Booting CheerpJ 4.2 (OpenJDK 17) + LWJGL 3 Bridge (v6)...", "glfw");
        await cheerpjInit({
          version: 17,
          status: "none",
          disableMetrics: true,
          natives: combinedNatives,
          javaProperties: [
            "java.library.path=/str",
            "org.lwjgl.librarypath=/str",
            "log4j.configurationFile=/str/log4j2.xml",
            "log4j2.configurationFile=/str/log4j2.xml",
            "log4j.skipJansi=true",
            "log4j2.disable.jmx=true",
            "org.lwjgl.util.NoChecks=true",
            "org.lwjgl.util.Debug=true",
            "org.lwjgl.util.DebugLoader=true",
            "org.lwjgl.system.allocator=system",
            "org.lwjgl.glfw.checkThread0=false",
            "java.awt.headless=true",
            "fml.earlyprogresswindow=false",
            "fml.ignoreInvalidMinecraftCertificates=true",
            "fml.ignorePatchDiscrepancies=true"
          ]
        });

        // 1. Mount safe Log4j2 XML configuration
        const safeLog4jXml = `<?xml version="1.0" encoding="UTF-8"?>
<Configuration status="OFF">
  <Appenders>
    <Console name="SysOut" target="SYSTEM_OUT">
      <PatternLayout alwaysWriteExceptions="false" pattern="[%d{HH:mm:ss}] [%t/%level] [%logger{1}]: %msg%n%ex"/>
    </Console>
  </Appenders>
  <Loggers>
    <Root level="info">
      <AppenderRef ref="SysOut"/>
    </Root>
  </Loggers>
</Configuration>`;
        cheerpOSAddStringFile("/str/log4j2.xml", new TextEncoder().encode(safeLog4jXml));

        // 2. Mount LWJGL 3 native library markers into /str/ so Library.loadSystem finds them immediately
        const dummyNativeBytes = new TextEncoder().encode("export default {};");
        const nativeMarkers = [
          "/str/lwjgl.js",
          "/str/liblwjgl.so",
          "/str/lwjgl_opengl.js",
          "/str/liblwjgl_opengl.so",
          "/str/lwjgl_stb.js",
          "/str/liblwjgl_stb.so",
          "/str/lwjgl_jemalloc.js",
          "/str/liblwjgl_jemalloc.so",
          "/str/lwjgl_tinyfd.js",
          "/str/libglfw.so",
          "/str/glfw.js",
          "/str/libopenal.so",
          "/str/openal.js",
          "/str/libGL.so.1",
          "/str/libGL.so",
          "/str/libjemalloc.so.2",
          "/str/jawt.js",
          "/str/netlib.js"
        ];
        for (const path of nativeMarkers) {
          cheerpOSAddStringFile(path, dummyNativeBytes);
        }

        MinecraftClient.register();
        await refreshDBStats();

        statusBanner.textContent = "JVM 17 Ready.";
        statusBanner.style.color = "#00e676";
        log("CheerpJ 17 Ready (/str/lwjgl.js native markers mounted). Waiting to launch.", "glfw");
        startBtn.disabled = false;
      } catch (err) {
        log(`FATAL JVM INIT ERROR: ${err.message || err}`, "err");
      }

      prismLibsInput.addEventListener("change", async () => {
        const files = Array.from(prismLibsInput.files || []);
        if (!files.length) return;
        startBtn.disabled = true;
        try {
          await mcElement.savePrismLibsToDB(files, (pct, msg) => {
            progressFill.style.width = `${pct}%`;
            statusBanner.textContent = msg;
          }, log);
          await refreshDBStats();
        } finally {
          startBtn.disabled = false;
        }
      });

      modUploadInput.addEventListener("change", async () => {
        const files = Array.from(modUploadInput.files || []);
        if (!files.length) return;
        await mcElement.saveModsToDB(files, log);
        await refreshDBStats();
      });

      clearCacheBtn.addEventListener("click", async () => {
        await mcElement.clearLibraryCache();
        await refreshDBStats();
        log("Cleared Lib/Mod IndexedDB cache.", "warn");
      });

      startBtn.addEventListener("click", async () => {
        startBtn.disabled = true;
        try {
          const code = await mcElement.run1201({
            mode: launchModeSelect.value,
            username: usernameInput.value || "Player",
            onProgress(pct, msg) {
              progressFill.style.width = `${Math.min(100, Math.max(0, pct))}%`;
              if (msg) statusBanner.textContent = msg;
            },
            log
          });
          log(`JVM main thread returned with code: ${code}`, "warn");
        } catch (err) {
          log(`EXECUTION HALTED: ${err.message || err}`, "err");
          if (err.stack) log(err.stack, "err");
          startBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
